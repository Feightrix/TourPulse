name: Build Quick EOD Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "quick-eod.html"
      - ".github/workflows/build-quick-eod-desktop.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package.json

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: TourPulse-Quick-EOD-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.yml
          if-no-files-found: error
          retention-days: 30
