name: Build Quick EOD Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-quick-eod-desktop.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Syntax check
        working-directory: desktop
        run: npm run check

      - name: Build Windows app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Smoke test unpacked Windows app
        shell: powershell
        run: |
          $exe = Join-Path $PWD "desktop\dist\win-unpacked\TourPulse Quick EOD.exe"
          if (!(Test-Path $exe)) { throw "Unpacked executable not found: $exe" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) {
            throw "Quick EOD exited during smoke test with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TourPulse-Quick-EOD-Windows
          path: |
            desktop/dist/TourPulse-Quick-EOD-*.exe
            desktop/dist/*.yml
          if-no-files-found: error
          retention-days: 30
