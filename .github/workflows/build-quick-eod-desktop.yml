name: Build Quick EOD Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-quick-eod-desktop.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Syntax check
        working-directory: desktop
        run: npm run check

      - name: Build Windows app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Smoke test unpacked Windows app
        shell: powershell
        run: |
          $exe = Join-Path $PWD "desktop\dist\win-unpacked\TourPulse Quick EOD.exe"
          if (!(Test-Path $exe)) { throw "Unpacked executable not found: $exe" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) {
            throw "Quick EOD exited during smoke test with code $($p.ExitCode)"
          }

          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $runValue = (Get-ItemProperty -Path $runKey -Name "TourPulse Quick EOD" -ErrorAction Stop)."TourPulse Quick EOD"
          if ($runValue -notlike "*TourPulse Quick EOD.exe*") {
            throw "Quick EOD startup registry entry was not registered correctly: $runValue"
          }

          Stop-Process -Id $p.Id -Force

      - name: Create install-or-patch package
        shell: powershell
        run: |
          $dist = Join-Path $PWD "desktop\dist"
          $package = Join-Path $dist "TourPulse-Quick-EOD-Install-or-Patch"
          if (Test-Path $package) { Remove-Item -Recurse -Force $package }
          New-Item -ItemType Directory -Path $package | Out-Null

          $portable = Get-ChildItem -Path $dist -Filter "TourPulse-Quick-EOD-*.exe" |
            Where-Object { $_.Name -notmatch "Setup" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $portable) { throw "Portable Quick EOD EXE was not found." }

          Copy-Item $portable.FullName (Join-Path $package "TourPulse Quick EOD.exe")
          Copy-Item (Join-Path $PWD "desktop\Install-or-Patch-TourPulse.cmd") $package
          Copy-Item (Join-Path $PWD "desktop\Repair-TourPulse-Startup.cmd") $package

          $zip = Join-Path $dist "TourPulse-Quick-EOD-Install-or-Patch-v1.7.0.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path (Join-Path $package "*") -DestinationPath $zip -CompressionLevel Optimal

          if (!(Test-Path $zip)) { throw "Install-or-patch ZIP was not created." }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TourPulse-Quick-EOD-Windows
          path: |
            desktop/dist/TourPulse-Quick-EOD-*.exe
            desktop/dist/TourPulse-Quick-EOD-Install-or-Patch-v1.7.0.zip
            desktop/dist/*.yml
          if-no-files-found: error
          retention-days: 30
